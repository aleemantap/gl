<!DOCTYPE html>

<html
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
<head>
    <title></title>
</head>
<body>
<div th:fragment="header">
    <header class="navbar navbar-expand-md d-print-none main-header">
        <div class="container-fluid px-3 px-md-4">
            <!-- =================================================
                 MOBILE MENU BUTTON
            ================================================== -->
            <button
                type="button"
                id="sidebar-toggle"
                class="sidebar-toggle"
                aria-label="Open navigation"
            >
                <i class="ti ti-menu-2"></i>
            </button>
            <!-- =================================================
                 LEFT HEADER
            ================================================== -->
            <div
                class="left-header"
                th:fragment="header-left"
            >
                <div class="breadcrumb">
                    <th:block
                        th:if="${breadcrumbItems != null and !#strings.isEmpty(breadcrumbItems)}"
                    >
                        <th:block
                            th:each="item, iter : ${breadcrumbItems}"
                        >

                            <span
                                th:if="${!iter.last}"
                                class="breadcrumb-parent"
                                th:text="${item}"
                            >
                                Console
                            </span>


                            <i
                                th:if="${!iter.last}"
                                class="ti ti-chevron-right breadcrumb-arrow"
                            ></i>


                            <strong
                                th:if="${iter.last}"
                                th:text="${item}"
                                class="breadcrumb-current"
                            >
                                Dashboard
                            </strong>

                        </th:block>

                    </th:block>


                    <strong
                        th:if="${breadcrumbItems == null or #strings.isEmpty(breadcrumbItems)}"
                        class="breadcrumb-current"
                    >
                        Dashboard
                    </strong>

                </div>

            </div>
            <!-- =================================================
                 RIGHT HEADER
            ================================================== -->

            <div class="navbar-nav flex-row order-md-last">
              <div class="nav-item dropdown">
                  <a href="#"
                    class="nav-link d-flex lh-1 text-reset p-0"
                    data-bs-toggle="dropdown"
                    aria-label="Open user menu"
                    aria-expanded="false">
                      <span class="avatar avatar-sm">
                          <img th:src="@{/img/000m.jpg}" class="rounded-3" alt="User">
                      </span>
                      <div class="d-none d-xl-block ps-2">
                          <div><span th:text="${currentUser.name}">Admin</span></div>
                          <div class="mt-1 small text-secondary">
                              <span th:text="${currentUser.userGroupName}">Admin</span>
                          </div>
                      </div>
                  </a>
                  <div class="dropdown-menu dropdown-menu-end dropdown-menu-arrow">

                      <a href="#" class="dropdown-item">
                          <i class="ti ti-user-circle me-2"></i>
                          Status
                      </a>

                      <a href="#" class="dropdown-item">
                          <i class="ti ti-user me-2"></i>
                          Profile
                      </a>

                      <a href="#" class="dropdown-item">
                          <i class="ti ti-message-circle me-2"></i>
                          Feedback
                      </a>

                      <div class="dropdown-divider"></div>

                      <a href="#" class="dropdown-item">
                          <i class="ti ti-settings me-2"></i>
                          Settings
                      </a>

                      <form th:action="@{/logout}" method="post" class="m-0">

                          <button type="submit"
                                  class="dropdown-item d-flex align-items-center border-0 bg-transparent w-100">

                              <i class="ti ti-logout me-2"></i>
                              Logout

                          </button>

                      </form>

                  </div>

              </div>
          </div>

        </div>

    </header>

</div>

</body>

</html>
