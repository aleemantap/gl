<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/main}"
>
  <head>
    <title>Daftar Jurnal</title>
  </head>
  <body>
     <div layout:fragment="content">
          <div class="container-xl">                
            <div class="filter-card">
                <div class="col-lg-12 col-md-12">
                    <div class="row mb-3">
                        <div class="col-lg-6 col-md-12">
                            <label class="filter-label">
                                <i class="bi bi-calendar-range"></i> Periode Transaksi
                            </label>
                            <div class="d-flex align-items-center gap-2">
                                <!-- Periode From -->
                                <div class="position-relative flex-grow-1">
                                    <i class="bi bi-calendar3 position-absolute"
                                    style="left: 15px; top: 50%; transform: translateY(-50%); color: #707780; z-index: 2;">
                                    </i>
                                    <input type="date" id="tanggalDari" class="form-control ps-5"
                                        th:value="${tanggalDari}">
                                </div>
                                
                                <!-- Tulisan "s/d" di tengah -->
                                <span class="fw-bold text-muted mx-1" style="font-size: 0.9rem; white-space: nowrap;">s/d</span>
                                
                                <!-- Periode To -->
                                <div class="position-relative flex-grow-1">
                                    <i class="bi bi-calendar3 position-absolute"
                                    style="left: 15px; top: 50%; transform: translateY(-50%); color: #707780; z-index: 2;">
                                    </i>
                                    <input type="date" id="tanggalSampai" class="form-control ps-5"
                                        th:value="${tanggalSampai}">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row g-4 align-items-start">
                  

                    <!-- Cabang -->
                    <div class="col-lg-3 col-md-6">
                        <label for="cabang" class="filter-label">
                            Cabang
                        </label>

                        <select id="cabang" class="form-select select2">
                            <option value="">Semua Cabang</option>
                            <option th:each="cabang : ${cabangList}" 
                                    th:value="${cabang.kodeCabang}" 
                                    th:text="${cabang.kodeCabang} + ' - ' + ${cabang.namaCabang}">
                            </option>
                        </select>
                    </div>
                    <!-- Kode TC -->
                    <div class="col-lg-3 col-md-6">
                        <label for="kodeTc" class="filter-label">
                            Kode TC
                        </label>
                        <select id="kodeTc" class="form-select select2">
                            <option value="">Semua Kode TC</option>
                            <th:block th:each="kt : ${kodeTransaksiList}">
                                <option th:value="${kt.kode}" th:text="${kt.kode + ' - ' + kt.namaTransaksi}"></option>
                            </th:block>
                        </select>
                    </div>
                    <!-- status reversal -->
                    <div class="col-lg-3 col-md-6">
                        <label for="kodeTc" class="filter-label">
                            Pembalikan/Reversal
                        </label>
                        <select id="pembalikan" class="form-select select2">
                                <option value="">--Pilih--</option>
                                <option value="NORMAL">Normal</option>
                                <option value="SUDAH DIREVERSAL">Sudah Direversal</option>
                                <option value="REVERSAL">Reversal</option>

                        </select>
                    </div>

                    <!-- Reversal -->
                    <!-- <div class="col-lg-3 col-md-6">
                        <div class="reversal-wrapper">
                            <input
                                type="checkbox"
                                class="reversal-switch"
                                id="reversal"
                            >
                            <label
                                for="reversal"
                                class="reversal-label"
                            >
                                Tampilkan Reversal
                            </label>
                        </div>
                    </div> -->
                </div>
                <hr class="filter-divider">
                <div class="filter-actions">
                    <div class="left-actions">
                        <button
                            type="button"
                            class="btn btn-filter"
                            id="btn-filter"
                        >
                            <img th:src="@{/img/filter-1.png}" />
                            Terapkan Filter
                        </button>
                        <button
                            type="button"
                            class="btn btn-reset"
                            id="btn-reset"
                        >
                            Reset
                        </button>
                    </div>
                    <button
                        type="button"
                        class="btn btn-export"
                        id="btn-export-exc"
                    >
                        <img th:src="@{/img/download.png}" />
                        Export Excel
                    </button>
                </div>
            </div>           
            <div class="row row-deck row-cards"  style="margin-top:20px;">            
              <div class="col-12">
                <div class="card">
                  <div class="table-responsive" style="overflow-x:hidden;padding-bottom: 20px;">
                    <table id="table-daftar-jurnal" class="table table-striped  card-table table-vcenter text-nowrap datatable datatable-checkbox">
                      <thead>
                        <tr>
                          <th class="text-center align-middle">
                                <input type="checkbox" class="form-check-input-th" id="check-all">
                           
                          </th>                 
                         
                          <th class="w-1">
                          </th>  
                          <th>
                            Journal No
                          </th>
                          <th>TransactionNo</th>
                          <th>TransactionCode</th>
                          <th>BranchCode</th>
                          <th>TransactionDate</th>
                          <th>TotalDebit</th>
                          <th>TotalCredit</th>
                          <th>Pembalikan</th> 
                          <th>Aksi</th>
                        </tr>
                      </thead>                    
                      <tbody>                       
                      </tbody>
                        <!-- <tfoot>
                            <tr>
                                <th colspan="6" class="text-end">
                                    <b>TOTAL TRANSAKSI HALAMAN INI Rp.</b>
                                </th>
                                <th id="total-amount"></th>
                                <th></th>
                            </tr>
                        </tfoot> -->
                    </table>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- modal pembalikan -->
          <div class="modal fade"
                id="reversalRequestModal"
                tabindex="-1"
                aria-hidden="true">

                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <div>
                                <h5 class="modal-title fw-semibold">
                                    <i class="bi bi-arrow-counterclockwise me-2"></i>
                                    Ajukan Pembalikan Jurnal
                                </h5>
                                <small class="text-muted">
                                    Permintaan akan dikirim untuk persetujuan.
                                </small>
                            </div>

                            <button type="button"
                                    class="btn-close"
                                    data-bs-dismiss="modal">
                            </button>
                        </div>

                        <div class="modal-body">
                            <input type="hidden" id="reversalJournalId">
                            <div class="mb-3">
                                <label class="form-label">
                                    Jurnal
                                </label>
                                <input type="text"
                                    id="reversalJournalNo"
                                    class="form-control"
                                    readonly>

                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">
                                    Alasan <span class="text-danger">*</span>
                                </label>

                                <input type="text"
                                    id="reversalReason"
                                    class="form-control"
                                    maxlength="100"
                                    placeholder="Contoh: Salah input nominal">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">
                                    Deskripsi
                                </label>
                                <textarea id="reversalDescription"
                                        class="form-control"
                                        rows="4"
                                        placeholder="Jelaskan alasan pembalikan secara lebih detail..."></textarea>

                            </div>
                            <div id="reversalError"
                                class="alert alert-danger d-none">
                            </div>
                        </div>

                        <div class="modal-footer">
                            <button type="button"
                                    class="btn btn-light"
                                    data-bs-dismiss="modal">
                                Batal
                            </button>
                            <button type="button"
                                    id="submitReversalRequest"
                                    class="btn btn-success">
                                <i class="bi bi-send me-1"></i>
                                Kirim Pengajuan
                            </button>
                        </div>

                    </div>

                </div>

            </div>
         
    </div>
    <div layout:fragment="scripts">    
        <link th:href="@{/css/select2.min.css}" rel="stylesheet">
        <link th:href="@{/css/select2-bootstrap-5-theme.min.css}" rel="stylesheet">
        <script th:src="@{/js/select2.min.js}"></script>
        <link th:href="@{/css/daftar-jurnal.css}" rel="stylesheet">
        <link th:href="@{/lib/DataTables/datatables.min.css}" rel="stylesheet">
        <script th:src="@{/lib/DataTables/datatables.min.js}"></script>   
        <script th:src="@{/js/laporan/daftar-jurnal.js}"></script>       
    </div>
  </body>
</html>
