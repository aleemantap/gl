<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/main}"
>
  <head>
    <title>Detail Jurnal</title>
  </head>
  <body>
     <div layout:fragment="content">
          <div class="container-xl">                
                    
            <div class="row row-deck row-cards"  style="margin-top:20px;">            
              <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0"><i class="fas fa-file-invoice"></i> Detail Jurnal</h5>
                    </div>
                        <div class="card-body">
                            
                            <!-- Header Informasi -->
                            <div class="row mb-4">
                                <div class="col-md-3">
                                    <div class="info-label">No. Jurnal</div>
                                    <div class="info-value" th:text="${detail.journalNo}">-</div>
                                </div>
                                <div class="col-md-3">
                                    <div class="info-label">No. Transaksi</div>
                                    <div class="info-value" th:text="${detail.transactionNo}">-</div>
                                </div>
                                <div class="col-md-3">
                                    <div class="info-label">Kode Transaksi</div>
                                    <div class="info-value" th:text="${detail.transactionCode}">-</div>
                                </div>
                                <div class="col-md-3">
                                    <div class="info-label">Kode Cabang</div>
                                    <div class="info-value" th:text="${detail.branchCode}">-</div>
                                </div>
                            </div>
                            
                            <div class="row mb-4">
                                <div class="col-md-4">
                                    <div class="info-label">Tanggal Transaksi</div>
                                    <div class="info-value" th:text="${#temporals.format(detail.transactionDate, 'dd-MM-yyyy HH:mm')}">-</div>
                                </div>
                                <div class="col-md-4">
                                    <div class="info-label">Status</div>
                                    <div class="info-value">
                                        <span th:if="${detail.status == 'POSTED'}" class="badge badge-posted">
                                            <i class="fas fa-check-circle"></i> POSTED
                                        </span>
                                        <span th:if="${detail.status == 'DRAFT'}" class="badge badge-draft">
                                            <i class="fas fa-pencil-alt"></i> DRAFT
                                        </span>
                                        <span th:if="${detail.status == 'VOID'}" class="badge badge-void">
                                            <i class="fas fa-times-circle"></i> VOID
                                        </span>
                                        <span th:if="${detail.status == null}" class="badge bg-secondary">UNKNOWN</span>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="info-label">Total Transaksi</div>
                                    <div class="info-value text-primary fw-bold" 
                                        th:text="${#numbers.formatDecimal(detail.totalDebit, 0, 'COMMA', 2, 'POINT')}">
                                        0
                                    </div>
                                </div>
                            </div>
                            
                            <hr>
                            
                            <!-- Tabel Detail Items -->
                            <div class="table-responsive mt-3">
                                <table class="table table-bordered table-hover table-detail">
                                    <thead>
                                        <tr>
                                            <th width="50">No</th>
                                            <th width="120">Kode Akun</th>
                                            <th>Nama Akun</th>
                                            <th>DK</th>
                                            <th class="text-end">Jumlah</th>
                                            <th>Keterangan</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="item, iter : ${detail.details}">
                                            <td class="text-center" th:text="${iter.index + 1}">1</td>
                                            <td th:text="${item.glAccountCode}">-</td>
                                            <td th:text="${item.glAccountName}">-</td>
                                            <td class="text-center">
                                                <span th:if="${item.dk == 'D'}" class="badge bg-primary text-white">D</span>
                                                <span th:if="${item.dk == 'K'}" class="badge bg-warning text-white">K</span>
                                            </td>
                                            <td class="text-end" 
                                                th:text="${#numbers.formatDecimal(item.amount, 0, 'COMMA', 2, 'POINT')}">
                                                0
                                            </td>
                                            <td th:text="${item.description}">-</td>
                                        </tr>
                                    </tbody>
                                    <tfoot>
                                        <tr class="total-row">
                                            <td colspan="4" class="text-end">TOTAL</td>
                                            <td class="text-end" 
                                                th:text="${#numbers.formatDecimal(detail.totalDebit, 0, 'COMMA', 2, 'POINT')}">
                                                0
                                            </td>
                                            <td></td>
                                        </tr>
                                        <tr class="total-row">
                                            <td colspan="4" class="text-end">Total Kredit</td>
                                            <td class="text-end" 
                                                th:text="${#numbers.formatDecimal(detail.totalCredit, 0, 'COMMA', 2, 'POINT')}">
                                                0
                                            </td>
                                            <td></td>
                                        </tr>
                                    </tfoot>
                                </table>
                            </div>
                            
                            <!-- Tombol Aksi -->
                            <div class="mt-4 d-flex gap-2">
                                <!-- <a th:href="@{/laporan/daftar-jurnal}" class="btn btn-sm btn-secondary btn-back">
                                    <i class="fas fa-arrow-left"></i> Kembali
                                </a> -->
                                <!-- <button onclick="window.print()" class="btn btn-primary btn-print">
                                    <i class="fas fa-print"></i> Print
                                </button>
                                <button onclick="exportExcel()" class="btn btn-success btn-print">
                                    <i class="fas fa-file-excel"></i> Export Excel
                                </button> -->
                            </div>
                        </div>
                    </div>    
              </div>
            </div>
          </div>
         
    </div>
    <div layout:fragment="scripts">     
        <!-- <link th:href="@{/css/select2.min.css}" rel="stylesheet"> -->
        <!-- <link th:href="@{/css/select2-bootstrap-5-theme.min.css}" rel="stylesheet"> -->
        <!-- <script th:src="@{/js/select2.min.js}"></script> -->
        <!-- <link th:href="@{/css/daftar-jurnal.css}" rel="stylesheet"> -->
        <link th:href="@{/lib/DataTables/datatables.min.css}" rel="stylesheet">
        <script th:src="@{/lib/DataTables/datatables.min.js}"></script>   
        <!-- <script th:src="@{/js/laporan/daftar-jurnal.js}"></script>  -->
        <script>
            function exportExcel() {
                // Implementasi export Excel
                alert('Fitur export Excel akan segera hadir');
            }
        </script>      
    </div>
  </body>
</html>
