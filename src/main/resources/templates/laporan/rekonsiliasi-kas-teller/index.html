<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/main}"
>
  <head>
    <title>Rekonsiliasi Kas Teller</title>
  </head>
  <body>
     <div layout:fragment="content">
        <div class="container-xl">  
           <!-- Alert Success -->
            <div th:if="${successMessage}" 
                class="alert alert-success alert-dismissible fade show" 
                role="alert">
                <div class="d-flex">
                    <div>
                        <span th:text="${successMessage}">Pesan sukses</span>
                    </div>
                </div>
                <a class="btn-close" data-bs-dismiss="alert" aria-label="close"></a>
            </div>

            <!-- Alert Danger / Error -->
            <div th:if="${errorMessage}" 
                class="alert alert-danger alert-dismissible fade show" 
                role="alert">
                <div class="d-flex">
                    <div>
                        <span th:text="${errorMessage}">Pesan error</span>
                    </div>
                </div>
                <a class="btn-close" data-bs-dismiss="alert" aria-label="close"></a>
            </div>
            <div id="card-data">
                <div class="row row-deck row-cards"  style="margin-top:20px;"> 
                    <div class="col-12">

                        <div class="card">

                            <h2>Rekonsiliasi Kas Teller</h2>
                                <div class="filter-card">
                                    <div class="filter-title">
                                    <span><svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-search" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                    <path stroke="none" d="0 0 24 24" fill="none"/>
                                    <path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
                                    <path d="M21 21l-6 -6" />
                                    </svg></span>
                                    Filter Rekonsiliasi
                                </div>
                                <form style="margin-top: 10px;" method="get" th:action="@{/laporan/rekonsiliasi-kas-teller}">

                                    <div class="row g-3">
        <!-- Teller User ID -->
        <div class="col-12 col-md-6">
            <label class="form-label required">Teller User ID</label>
            <input type="number" 
                class="form-control" 
                name="tellerUserId" 
                required 
                placeholder="Contoh: 42" 
                th:value="${result?.tellerUserId}">
        </div>

        <!-- Kas Point -->
        <div class="col-12 col-md-6">
            <label class="form-label required">Kas Point</label>
            <input type="text" 
                class="form-control" 
                name="kasPointCode" 
                placeholder="Contoh: JKT1-TLR01" 
                required 
                th:value="${result?.kasPointCode}">
        </div>

        <!-- Tanggal -->
        <div class="col-12 col-md-6">
            <label class="form-label required">Tanggal</label>
            <input type="date" 
                class="form-control" 
                name="date" 
                required 
                th:value="${result?.date}">
        </div>

        <!-- Saldo Awal -->
        <div class="col-12 col-md-6">
            <label class="form-label required">Saldo Awal</label>
            <div class="input-group">
                <span class="input-group-text">Rp</span>
                <input type="text" 
                    class="form-control text-end currency-input rupiah-input" 
                    id="openingBalance" 
                    name="openingBalance" 
                    placeholder="0" 
                    required 
                    th:value="${result?.openingBalance}">
            </div>
        </div>

        <!-- Saldo Kas Fisik -->
        <div class="col-12">
            <label class="form-label required">Saldo Kas Fisik</label>
            <div class="input-group">
                <span class="input-group-text">Rp</span>
                <input type="text" 
                    class="form-control text-end currency-input rupiah-input" 
                    id="physicalBalance" 
                    name="physicalBalance" 
                    placeholder="0" 
                    required 
                    th:value="${result?.physicalBalance}">
            </div>
        </div>
    </div>

                                    <button type="submit">
                                        Hitung Rekonsiliasi
                                    </button>

                                </form>


                                
                            </div>
                        
                        
                        </div>

                    </div>                   
                </div>
            
                
                
                <div class="card"
                    th:if="${result != null}">

                    <h3>Ringkasan Kas</h3>

                    <div class="summary" style="">

                        <div class="summary-box">
                            <div class="summary-title">
                                Saldo Awal
                            </div>

                            <div class="summary-value"
                                th:text="${result.openingBalanceFormatted}">
                            </div>
                        </div>


                        <div class="summary-box">
                            <div class="summary-title">
                                Kas Masuk
                            </div>

                            <div class="summary-value"
                                th:text="${result.totalInFormatted}">
                            </div>
                        </div>


                        <div class="summary-box">
                            <div class="summary-title">
                                Kas Keluar
                            </div>

                            <div class="summary-value"
                                th:text="${result.totalOutFormatted}">
                            </div>
                        </div>


                        <div class="summary-box">
                            <div class="summary-title">
                                Saldo Sistem
                            </div>

                            <div class="summary-value"
                                th:text="${result.systemBalanceFormatted}">
                            </div>
                        </div>


                        <div class="summary-box">

                            <div class="summary-title">
                                Status
                            </div>

                            <div class="status"
                                th:classappend="${result.status == 'MATCH'} ? ' match' : ' selisih'"
                                th:text="${result.status}">
                            </div>

                        </div>

                    </div>

                </div>


                <div class="card"
                    th:if="${result != null}">
                    <h3>Hasil Rekonsiliasi</h3>
                    <table>
                        <tr>
                            <td>Saldo Menurut Sistem</td>
                            <td class="amount"
                                th:text="${result.systemBalanceFormatted}">
                            </td>
                        </tr>
                        <tr>
                            <td>Saldo Kas Fisik</td>
                            <td class="amount"
                                th:text="${result.physicalBalanceFormatted}">
                            </td> 
                        </tr>
                        <tr> 
                            <td><strong>Selisih</strong></td>
                            <td class="amount">
                                <strong th:text="${result.differenceFormatted}">
                                </strong>
                            </td>
                        </tr>
                    </table>
                </div>
                <div class="card"
                    th:if="${result != null}">
                    <!-- <h3>Detail Pergerakan Kas</h3> -->
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h3 class="card-title mb-0" style="font-weight: 800;">
                            Detail Pergerakan Kas
                        </h3>

                        <button class="btn btn-primary-grey d-flex align-items-center gap-2" onclick="exportToExcelPergerakanKas()">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48">
                            <path fill="#4CAF50" d="M41,10H25v28h16c0.552,0,1-0.448,1-1V11C42,10.448,41.552,10,41,10z"/>
                            <path fill="#FFF" d="M32 15H37V18H32zM32 20H37V23H32zM32 25H37V28H32zM32 30H37V33H32zM27 15H30V18H27zM27 20H30V23H27zM27 25H30V28H27zM27 30H30V33H27z"/>
                            <path fill="#2E7D32" d="M25,38V10l-19,3v22L25,38z"/>
                            <path fill="#FFF" d="M9.8 29l3.2-5.3-3-5.2h3.3l1.5 3.3 1.6-3.3h3.1l-3.2 5.1 3.3 5.4h-3.3l-1.7-3.6-1.7 3.6H9.8z"/>
                        </svg>
                        <span>Export Excel</span>
                        </button>
                    </div>
                    <table>
                        <thead>
                        <tr>
                            <th>Waktu</th>
                            <th>Journal</th>
                            <th>Direction</th>
                            <th>Keterangan</th>
                            <th class="amount">Nominal</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="movement : ${result.movements}">
                            <td th:text="${movement.occurredAt}">
                            </td>
                            <td th:text="${movement.journalHeaderId}">
                            </td>
                        <td>
                                <span th:if="${movement.direction == 'IN'}"
                                    class="direction-badge badge-in">
                                    ↓ IN
                                </span>

                                <span th:if="${movement.direction == 'OUT'}"
                                    class="direction-badge badge-out">

                                    ↑ OUT

                                </span>

                            </td>

                            <td th:text="${movement.description}">
                            </td>

                            <td class="amount"
                                th:text="${movement.amountFormatted}">
                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>
            </div>

            <div class="action-footer"
                th:if="${result != null}">

                <!-- <button type="button"
                        class="btn-save btn-primary text-black"
                        th:disabled="${result.physicalBalance == null}">

                     Simpan Rekonsiliasi

                </button> -->
                <!-- SIMPAN -->
                <form method="post"
                    th:action="@{/laporan/rekonsiliasi-kas-teller/save}"
                    th:if="${result.physicalBalance != null}">

                    <input type="hidden"
                        name="tellerUserId"
                        th:value="${result.tellerUserId}">

                    <input type="hidden"
                        name="kasPointCode"
                        th:value="${result.kasPointCode}">

                    <input type="hidden"
                        name="date"
                        th:value="${result.date}">

                    <input type="hidden"
                        name="openingBalance"
                        th:value="${result.openingBalance}">

                    <input type="hidden"
                        name="physicalBalance"
                        th:value="${result.physicalBalance}">

                    <div class="action-footer">

                        <button type="submit"
                                class="btn-save btn-primary text-blue"
                                th:disabled="${result.physicalBalance == null}">
                             Simpan Rekonsiliasi
                        </button>

                    </div>

                </form>

                 <!-- APPROVAL -->
                <div th:if="${result.status == 'SELISIH'}"
                    class="approval-actions">

                    <button type="button"
                            class="btn-approve">
                        Approve
                    </button>

                    <button type="button"
                            class="btn-reject">
                        Reject
                    </button>

                </div>

            </div>
           
           
        
        </div>         
    </div>
    <div layout:fragment="scripts">     
        <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
        <link th:href="@{/css/select2.min.css}" rel="stylesheet">
        <link th:href="@{/css/select2-bootstrap-5-theme.min.css}" rel="stylesheet">
        <script th:src="@{/js/select2.min.js}"></script>
        <link th:href="@{/css/rekonsiliasi-kas-teller.css}" rel="stylesheet">
        <link th:href="@{/lib/DataTables/datatables.min.css}" rel="stylesheet">
        <script th:src="@{/lib/DataTables/datatables.min.js}"></script>   
        <script th:src="@{/js/laporan/rekonsiliasi-kas-teller.js}"></script>       
    </div>
  </body>
</html>
