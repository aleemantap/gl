<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/main}"
>
  <head>
    <title>Neraca Saldo</title>
  </head>
  <body>
     <div layout:fragment="content">
          <div class="container-xl">                
            <div class="filter-card">
                <div class="row g-4 align-items-start">
                  
                    <div class="col-lg-12 col-md-12">
                        <div class="row mb-3">
                            <div class="col-lg-6 col-md-12">
                                <label class="filter-label">
                                    <i class="bi bi-calendar-range"></i> Periode Transaksi
                                </label>
                                <div class="d-flex align-items-center gap-2">
                                    <!-- Periode From -->
                                    <div class="position-relative flex-grow-1">
                                        <i class="bi bi-calendar3 position-absolute"
                                        style="left: 15px; top: 50%; transform: translateY(-50%); color: #707780; z-index: 2;">
                                        </i>
                                        <input type="date" id="tanggalDari" class="form-control ps-5"
                                            th:value="${tanggalDari}">
                                    </div>
                                    
                                    <!-- Tulisan "s/d" di tengah -->
                                    <span class="fw-bold text-muted mx-1" style="font-size: 0.9rem; white-space: nowrap;">s/d</span>
                                    
                                    <!-- Periode To -->
                                    <div class="position-relative flex-grow-1">
                                        <i class="bi bi-calendar3 position-absolute"
                                        style="left: 15px; top: 50%; transform: translateY(-50%); color: #707780; z-index: 2;">
                                        </i>
                                        <input type="date" id="tanggalSampai" class="form-control ps-5"
                                            th:value="${tanggalSampai}">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Cabang -->
                    <div class="col-lg-6 col-md-6">
                        <label for="cabang" class="filter-label">
                            Cabang
                        </label>
                        <select id="branchCode" class="form-select select2">
                            <option value="">Semua Cabang</option>                           
                            <option th:each="cabang : ${cabangList}" 
                                    th:value="${cabang.kodeCabang}" 
                                    th:text="${cabang.kodeCabang} + ' - ' + ${cabang.namaCabang}">
                            </option>
                            
                        </select>
                    </div>
                    
                    <!-- Reversal -->
                    <div class="col-lg-3 col-md-6">
                        
                    </div>
                </div>
                 <hr class="filter-divider">
                <div class="filter-actions">
                    <div class="left-actions">
                        <button
                            type="button"
                            class="btn btn-filter"
                            id="btnFilter"
                        >
                            <img th:src="@{/img/filter-1.png}" />
                            Terapkan Filter
                        </button>
                        <!-- <button
                            type="button"
                            class="btn btn-reset"
                            id="btnReset"
                        >
                            Reset
                        </button> -->
                    </div>
                    <!-- <button
                        type="button"
                        class="btn btn-export"
                        id="btn-export-pdf"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <text x="7" y="17" font-size="6" font-family="Arial, sans-serif" font-weight="bold" fill="currentColor" stroke="none">PDF</text>
                        </svg>
                        Export PDF
                    </button>  -->
                    <button
                        type="button"
                        class="btn btn-export"
                        id="btn-export-exc"
                    >
                        <img th:src="@{/img/download.png}" />
                        Export Excel
                    </button>
                </div>
               

            </div>          
            
            <div class="row row-deck row-cards"  style="margin-top:20px;">            
              <div class="col-12">
                <div class="card">
                    <div class="card-header" style="padding:16px 8px !important;">
                        <h3 class="card-title" style="font-weight: 800;">
                            Neraca Saldo Report
                        </h3>
                    </div> 
                  <div class="table-responsive" style="overflow-x:hidden;padding-bottom: 10px;">
                    <table style="width: 100%;" id="neracaSaldoTable" class="table table-striped  card-table table-vcenter text-nowrap datatable">
                      <thead>
                        <tr>
                            <th class="text-center align-middle">
                                <input type="checkbox" class="form-check-input-th" id="check-all">
                            </th>      
                            <th>No GL</th>
                            <th>Nama Account</th>
                            <th>Normal</th>
                            <th>Saldo Awal</th>
                            <th>Debit</th>
                            <th>Kredit</th>
                            <th>Saldo Akhir Debit</th>
                            <th>Saldo Akhir Kredit</th>
                        </tr>
                      </thead>
                    
                      <tbody>                       
                      </tbody>
                      <tfoot>

                            <tr>

                                <th colspan="3"
                                    class="text-end">

                                    TOTAL

                                </th>

                                <th></th>

                                <th></th>

                                <th></th>

                                <th></th>

                                <th></th>

                            </tr>

                        </tfoot>
                    </table>
                  </div>
                </div>
                
              </div>
            </div>

            <div class="d-flex justify-content-end mt-3">
                <button
                    type="button"
                    id="btnSubmitValidasi"
                    class="btn btn-primary">
                    <i class="bi bi-send"></i>
                    Kirim untuk Validasi
                </button>
            </div>
          </div>
         
    </div>
    <div layout:fragment="scripts">     
        <link th:href="@{/css/select2.min.css}" rel="stylesheet">
        <link th:href="@{/css/select2-bootstrap-5-theme.min.css}" rel="stylesheet">
        <script th:src="@{/js/select2.min.js}"></script>
        <link th:href="@{/css/daftar-jurnal.css}" rel="stylesheet">
        <link th:href="@{/lib/DataTables/datatables.min.css}" rel="stylesheet">
        <script th:src="@{/lib/DataTables/datatables.min.js}"></script>   
        <script th:src="@{/js/laporan/neraca-saldo.js}"></script>       
    </div>
  </body>
</html>
