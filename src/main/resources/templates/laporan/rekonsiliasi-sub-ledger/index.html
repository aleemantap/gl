<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">

<head>
    <title>Rekonsiliasi Sub Ledger</title>
</head>

<body>

<div layout:fragment="content">

    <div class="container-xl">

        <!-- =========================
             FILTER
        ========================== -->
        <div class="row row-deck row-cards">

            <div class="col-12">

                <div class="card">

                    <div class="card-header">
                        <h3 class="card-title">
                            SUB LEDGER REKONSILIASI
                        </h3>
                    </div>

                    <div class="card-body">

                        <div class="row g-3 align-items-end">

                            <!-- Akun GL -->
                            <div class="col-md-4">

                                <div class="form-group">

                                    <label class="form-label">
                                        Akun GL
                                    </label>

                                    <select id="glAccountId"
                                            class="form-select">

                                        <option value="">
                                            -- Pilih Akun --
                                        </option>

                                        <option th:each="account : ${accounts}"
                                                th:value="${account.id}"
                                                th:text="${account.nomorGl + ' - ' + account.namaGlAccount}">
                                        </option>

                                    </select>

                                </div>

                            </div>


                            <!-- Periode Mulai -->
                            <div class="col-md-3">

                                <div class="form-group">

                                    <label class="form-label">
                                        Periode Mulai
                                    </label>

                                    <input type="date"
                                           id="startDate"
                                           class="form-control">

                                </div>

                            </div>


                            <!-- Periode Akhir -->
                            <div class="col-md-3">

                                <div class="form-group">

                                    <label class="form-label">
                                        Periode Akhir
                                    </label>

                                    <input type="date"
                                           id="endDate"
                                           class="form-control">

                                </div>

                            </div>


                            <!-- Button -->
                            <div class="col-md-2">

                                <button type="button"
                                        id="btnReconcile"
                                        class="btn btn-primary w-100">

                                    <svg xmlns="http://www.w3.org/2000/svg"
                                         class="icon icon-tabler icon-tabler-search"
                                         width="24"
                                         height="24"
                                         viewBox="0 0 24 24"
                                         stroke-width="2"
                                         stroke="currentColor"
                                         fill="none"
                                         stroke-linecap="round"
                                         stroke-linejoin="round">

                                        <path stroke="none"
                                              d="M0 0h24v24H0z"
                                              fill="none"/>

                                        <circle cx="10"
                                                cy="10"
                                                r="7"/>

                                        <line x1="21"
                                              y1="21"
                                              x2="15"
                                              y2="15"/>

                                    </svg>

                                    Tampilkan

                                </button>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>


        <!-- =========================
             RESULT
        ========================== -->

        <div id="resultSection"
             style="display: none;">

            <div class="row row-deck row-cards mt-3">


                <!-- =========================
                     ACCOUNT INFORMATION
                ========================== -->

                <div class="col-12">

                    <div class="card">

                        <div class="card-body">

                            <div class="row g-4">

                                <!-- Akun -->
                                <div class="col-md-6">

                                    <div class="text-muted">
                                        Akun
                                    </div>

                                    <div class="fw-bold fs-3"
                                         id="accountName">
                                    </div>

                                </div>


                                <!-- Periode -->
                                <div class="col-md-6">

                                    <div class="text-muted">
                                        Periode
                                    </div>

                                    <div class="fw-bold fs-3"
                                         id="period">
                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>


                <!-- =========================
                     SUMMARY
                ========================== -->
                <div class="col-md-12">
                    <div class="row g-3">

                        <!-- Total Debit -->
                        <div class="col-md-4 col-sm-6">
                            <div class="card h-100">
                                <div class="card-body d-flex flex-column justify-content-between">
                                    <div class="subheader text-muted">Total Debit</div>
                                    <div class="h2 mb-0" id="totalDebit">Rp 0</div>
                                </div>
                            </div>
                        </div>

                        <!-- Total Kredit -->
                        <div class="col-md-4 col-sm-6">
                            <div class="card h-100">
                                <div class="card-body d-flex flex-column justify-content-between">
                                    <div class="subheader text-muted">Total Kredit</div>
                                    <div class="h2 mb-0" id="totalCredit">Rp 0</div>
                                </div>
                            </div>
                        </div>

                        <!-- Saldo GL -->
                        <div class="col-md-4 col-sm-6">
                            <div class="card h-100">
                                <div class="card-body d-flex flex-column justify-content-between">
                                    <div class="subheader text-muted">Saldo GL</div>
                                    <div class="h2 mb-0" id="saldoGl">Rp 0</div>
                                </div>
                            </div>
                        </div>

                        <!-- Saldo Sub Ledger -->
                        <div class="col-md-4 col-sm-6">
                            <div class="card h-100">
                                <div class="card-body d-flex flex-column justify-content-between">
                                    <div class="subheader text-muted">Saldo Sub Ledger</div>
                                    <div class="h2 mb-0" id="saldoSubLedger">Rp 0</div>
                                </div>
                            </div>
                        </div>

                        <!-- Selisih -->
                        <div class="col-md-4 col-sm-6">
                            <div class="card h-100">
                                <div class="card-body d-flex flex-column justify-content-between">
                                    <div class="subheader text-muted">Selisih</div>
                                    <div class="h2 mb-0" id="difference">Rp 0</div>
                                </div>
                            </div>
                        </div>

                        <!-- Status -->
                        <div class="col-md-4 col-sm-6">
                            <div class="card h-100">
                                <div class="card-body d-flex flex-column justify-content-between">
                                    <div class="subheader text-green">Status</div>
                                    <div class="h2 mb-0" id="status">
                                        <span class="badge bg-success text-white">-</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

                <!-- =========================
                     DETAIL TABLE
                ========================== -->

                <div class="col-12">

                    <div class="card">

                       <div class="card-header d-flex justify-content-between align-items-center">
                            <h3 class="card-title mb-0" style="font-weight: 800;">
                                Detail Transaksi
                            </h3>

                            <button class="btn btn-primary-grey d-flex align-items-center gap-2" onclick="exportToExcel()">
                               <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48">
                                <path fill="#4CAF50" d="M41,10H25v28h16c0.552,0,1-0.448,1-1V11C42,10.448,41.552,10,41,10z"/>
                                <path fill="#FFF" d="M32 15H37V18H32zM32 20H37V23H32zM32 25H37V28H32zM32 30H37V33H32zM27 15H30V18H27zM27 20H30V23H27zM27 25H30V28H27zM27 30H30V33H27z"/>
                                <path fill="#2E7D32" d="M25,38V10l-19,3v22L25,38z"/>
                                <path fill="#FFF" d="M9.8 29l3.2-5.3-3-5.2h3.3l1.5 3.3 1.6-3.3h3.1l-3.2 5.1 3.3 5.4h-3.3l-1.7-3.6-1.7 3.6H9.8z"/>
                            </svg>
                            <span>Export Excel</span>
                            </button>
                        </div>

                        <div class="card-body">

                            <div class="table-responsive">

                                <table class="table table-striped
                                              card-table
                                              table-vcenter
                                              table-bordered">

                                    <thead>

                                        <tr>

                                            <th class="text-nowrap">
                                                Tanggal
                                            </th>

                                            <th class="text-nowrap">
                                                No Jurnal
                                            </th>

                                            <th class="text-nowrap">
                                                No Transaksi
                                            </th>

                                            <th class="text-end text-nowrap">
                                                Debit
                                            </th>

                                            <th class="text-end text-nowrap">
                                                Kredit
                                            </th>

                                            <th class="text-end text-nowrap">
                                                Saldo
                                            </th>

                                            <th class="text-nowrap">
                                                Keterangan
                                            </th>

                                        </tr>

                                    </thead>

                                    <tbody id="detailBody">

                                        <!-- Data diisi oleh JavaScript -->

                                    </tbody>

                                </table>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- =========================
     SCRIPTS
========================== -->

<div layout:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link th:href="@{/css/select2.min.css}" rel="stylesheet">
    <link th:href="@{/css/select2-bootstrap-5-theme.min.css}" rel="stylesheet">
    <link th:href="@{/lib/DataTables/datatables.min.css}" rel="stylesheet">
    <script th:src="@{/js/select2.min.js}"> </script>
    <script th:src="@{/lib/DataTables/datatables.min.js}"></script>
    <script th:src="@{/js/laporan/rekonsiliasi-sub-ledger.js}"></script>

</div>

</body>

</html>
