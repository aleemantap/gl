<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/main}"
>
  <head>
    <title>Input Jurnal Manual</title>
  </head>
  <body>
    <div layout:fragment="content">
        <div class="container-xl">
            <div class="card">
                <div class="card-header">
                    <ul class="nav nav-tabs card-header-tabs" data-bs-toggle="tabs" role="tablist">
                        
                        <li class="nav-item tab-pem-akun" role="presentation">
                            <a href="#tabs-1" class="nav-link active" data-bs-toggle="tab" aria-selected="false" role="tab">
                                Form Input Manual
                            </a>
                        </li>
                        <li class="nav-item tab-pem-akun" role="presentation">
                            <a href="#tabs-2" class="nav-link" data-bs-toggle="tab" aria-selected="true" role="tab" tabindex="-1">
                              Import Via Excel
                            </a>
                        </li>
                       
                    </ul>
                </div>
                <div class="card-body">
                <div class="tab-content">
                    <div class="tab-pane  active show" id="tabs-1" role="tabpanel">
                        <div th:replace="~{operasional/input-jurnal-manual/form :: form}"></div>  
                    </div>
                    <div class="tab-pane" id="tabs-2" role="tabpanel">
                       <div th:replace="~{operasional/input-jurnal-manual/import :: import}"></div>
                    </div>
                  
                </div>
                </div>
            </div>    
        </div>  
        <!-- <div th:replace="~{parameter/pemetaanAkun/add1 :: add1}"></div>     -->
        <!-- <div th:replace="~{parameter/pemetaanAkun/add2 :: add2}"></div>      -->
        <!-- <div th:replace="~{parameter/pemetaanAkun/addCmp :: addCmp}"></div>    -->
    </div>
    <div layout:fragment="scripts">
        <!-- Tambahkan SheetJS untuk membaca Excel -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
        <link th:href="@{/css/select2.min.css}" rel="stylesheet">
        <link th:href="@{/css/select2-bootstrap-5-theme.min.css}" rel="stylesheet">
        <script th:src="@{/js/select2.min.js}"></script>
        <link th:href="@{/css/pemetaanAkun.css}" rel="stylesheet">
        <link th:href="@{/css/inputJurnal.css}" rel="stylesheet">
        <link th:href="@{/lib/DataTables/datatables.min.css}" rel="stylesheet">
        <script th:src="@{/lib/DataTables/datatables.min.js}"></script>   
        <script th:src="@{/js/operasional/input-manual-form.js}"></script>
        <script th:src="@{/js/operasional/input-import-form.js}"></script>
        <!-- <script th:src="@{/js/parameter/pemetaan-akun2.js}"></script> -->
    </div>
  </body>
</html>
