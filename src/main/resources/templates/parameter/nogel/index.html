<!doctype html>
<html layout:decorate="~{layouts/main}">
  <head>
    <title>Nomor GL</title>
  </head>
  <body>
    
    <div layout:fragment="header">
        <!-- <div th:replace="~{layouts/header/header-gl :: header}"></div> -->
         <div th:replace="~{layouts/header :: header}"></div>
    </div>

    <div layout:fragment="content">
        <div class="container-xl">
            <div class="row g-2 align-items-center">
              <div class="col">
                <div class="gl-container">
                  <h2 class="gl-title">Parameter Nomor GL</h2>
                  <!-- <div class="gl-alert-box">
                    <div class="gl-icon">
                      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="16" x2="12" y2="12"></line>
                        <line x1="12" y1="8" x2="12.01" y2="8"></line>
                      </svg>
                    </div>
                    <p class="gl-text">
                      "GL Account tidak ditentukan oleh desain GL &mdash; tim Gadai bebas mendaftarkan sesuai kebutuhan untuk akurasi pelaporan keuangan internal dan audit."
                    </p>
                  </div> -->
                </div>
              </div>
             
              <div class="col-auto ms-auto d-print-none">
                <div class="btn-list" style="margin-top:85px;">
                    <a href="#" class="btn btn-primary d-none d-sm-inline-block btn-primary-text" id="btnTambah">
                    + TAMBAH ACCOUNT GL
                    </a>    

                   <button
                        type="button"
                        class="btn btn-primary btn-primary-black"
                        id="btn-export-exc"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <path d="M8 13l3 4"/>
                        <path d="M11 13l-3 4"/>
                        </svg>
                        Export Excel
                    </button>

                </div>
              </div>
              
            </div>
            <div class="row mb-3 align-items-end">

                  <!-- BAGIAN KIRI -->
                  <div class="col-md-12">
                      <!-- Tombol Toggle Filter -->
                      <div class="row mb-2">
                          <div class="col-12">
                              <button type="button" 
                                      class="btn btn-outline-primary btn-sm" 
                                      id="toggleFilterBtn">
                                  <i class="ti ti-chevron-down" id="toggleIcon"></i>
                                  <span id="toggleText">Sembunyikan Filter</span>
                              </button>
                          </div>
                      </div>

                      <!-- Container Filter -->
                      <div id="filterContainer">
                          <div class="row">
                              <!-- Nomor GL -->
                              <div class="col-md-4">
                                  <label class="form-label">Nomor GL</label>
                                  <input type="text"
                                      class="form-control form-control"
                                      id="filterNomorGl"
                                      placeholder="Nomor GL">
                              </div>

                              <!-- Nama GL -->
                              <div class="col-md-4">
                                  <label class="form-label">Nama GL</label>
                                  <input type="text"
                                      class="form-control form-control"
                                      id="filterNamaGl"
                                      placeholder="Nama GL">
                              </div> 

                              <!-- type -->
                              <div class="col-md-4">
                                  <label class="form-label">Type GL Account</label>
                                  <select class="form-select form-select"
                                          id="filterTypeGl">
                                       <option value="">Semua</option>
                                      <th:block th:each="kategori : ${glTypeList}">
                                          <option th:value="${kategori.id}"
                                                  th:text="${kategori.name}">
                                          </option>
                                      </th:block>
                                  </select>
                              </div>
                          </div>
                          
                          <div class="row mt-2">
                              <!-- D/K -->
                              <div class="col-md-4">
                                  <label class="form-label">Saldo Normal D/K</label>
                                  <select class="form-select form-select"
                                          id="filterSaldoNormal">
                                      <option value="">Semua</option>
                                      <option value="D">Debit</option>
                                      <option value="K">Kredit</option>
                                  </select>
                              </div> 

                              <!-- Cabang -->
                              <!-- <div class="col-md-4">
                                  <label class="form-label">Cabang</label>
                                  <select class="form-select form-select select2"
                                          id="cabangGL"
                                          name="cabangGL">
                                      <option value="">Semua Cabang</option>
                                      <th:block th:each="cabang : ${cabangList}">
                                          <option th:value="${cabang.id}"
                                                  th:text="${cabang.namaCabang}">
                                          </option>
                                      </th:block>
                                  </select>
                              </div> -->

                              <!-- Action -->
                              <div class="col-md-4">
                                  <div class="d-flex gap-2" style="margin-top: 2em;">
                                      <button type="button"
                                              class="btn btn-primary btn-md"
                                              id="btnFilterGl">
                                          <i class="ti ti-filter"></i>
                                          Filter
                                      </button>

                                      <button type="button"
                                              class="btn btn-outline-secondary btn-sm"
                                              id="btnResetFilterGl">
                                          <i class="ti ti-refresh"></i>
                                          Reset
                                      </button>
                                  </div>
                              </div>
                          </div>
                      </div>
                  </div>

            </div>

            <div class="row row-deck row-cards"  style="margin-top:20px;">
          
              <div class="col-12">
                <div class="card">
                  <div class="table-responsive" style="overflow-x:hidden;padding-bottom: 10px;">
                    <table id="table-nogel"  class="table table-striped card-table table-vcenter text-nowrap datatable">
                      <thead>
                        <tr>
                          <th class="">
                              <input type="checkbox" style="margin-left:12px;height: 1.2rem !important; width: 1.2rem !important;" id="check-all">
                          </th>   
                          <th class="w-1">Nomor GL 
                          </th>
                          <th>Nama GL Account</th>
                          <th>Type GL Account</th>
                          <th>Saldo Normal</th>
                          <!-- <th>Cabang</th> -->
                          <th>Aksi</th> 
                        </tr>
                      </thead>
                      <tbody>
                      </tbody>
                    </table>
                  </div>         
                </div>
              </div>
            </div>
        </div>       
        <div th:replace="~{parameter/nogel/add :: add}"></div>
    </div>
   
   
    <div layout:fragment="scripts">
        <link th:href="@{/lib/DataTables/datatables.min.css}" rel="stylesheet">
        <script th:src="@{/lib/DataTables/datatables.min.js}"></script>   
        <script th:src="@{/js/parameter/nogel-list.js}"></script>
    </div>
  </body>
</html>
