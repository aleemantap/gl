<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/main}"
>
  <head>
    <title>Kode Transaksi</title>
  </head>
  <body>
       <div layout:fragment="content">
          <div class="container-xl">
            <div class="row g-2 align-items-center">             
                <div class="catalog-container">

                  <div class="catalog-header">
                      <div>
                          <h2>Katalog Kode Transaksi</h2>
                          <p>Definisi parameter akuntansi untuk seluruh modul operasional gadai.</p>
                      </div>

                      <div class="catalog-action">
                          <button class="btn-export" id="btn-export-kode">
                              <i class="fa-solid fa-download"></i>
                              Export Katalog
                          </button>

                          <button class="btn-add" id="btn-add-kode">
                              <i class="fa-solid fa-plus"></i>
                              Tambah Kode
                          </button>
                      </div>
                  </div>

                  <div class="row mb-3 align-items-end">

                        <!-- BAGIAN KIRI -->
                        <div class="col-md-12">
                            <!-- Tombol Toggle Filter -->
                            <div class="row mb-2">
                                <div class="col-12">
                                    <button type="button" 
                                            class="btn btn-outline-primary btn-sm" 
                                            id="toggleFilterBtn">
                                        <i class="ti ti-chevron-down" id="toggleIcon"></i>
                                        <span id="toggleText">Sembunyikan Filter</span>
                                    </button>
                                </div>
                            </div>

                            <!-- Container Filter -->
                            <div id="filterContainer">
                                <div class="row">
                                    <!-- Nomor GL -->
                                    <div class="col-md-4">
                                        <label class="form-label">Kode Transaki</label>
                                        <input type="text"
                                            class="form-control form-control"
                                            id="kode"
                                            placeholder="Kode Transaksi">
                                    </div>

                                    <!-- Nama GL -->
                                    <div class="col-md-4">
                                        <label class="form-label">Nama</label>
                                        <input type="text"
                                            class="form-control form-control"
                                            id="nama"
                                            placeholder="Nama Transaksi">
                                    </div> 

                                   
                                </div>
                                
                                <div class="row mt-2">
                                    <!-- Action -->
                                    <div class="col-md-4">
                                        <div class="d-flex gap-2" style="margin-top: 2em;">
                                            <button type="button"
                                                    class="btn btn-primary btn-md"
                                                    id="btnFilter">
                                                <i class="ti ti-filter"></i>
                                                Filter
                                            </button>

                                            <button type="button"
                                                    class="btn btn-outline-secondary btn-sm"
                                                    id="btnResetFilter">
                                                <i class="ti ti-refresh"></i>
                                                Reset
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                  </div>

                  <!-- <div class="info-box">

                      <div class="info-icon">
                          <i class="fa-solid fa-circle-info"></i>
                      </div>

                      <div class="info-content">
                          <h4>Informasi Pemetaan Sistem</h4>

                          <p>
                              Kode berlabel <strong>'Direncanakan'</strong> sudah dikatalogkan
                              dalam struktur master data pusat tetapi belum dipetakan ke JournalId
                              pada ledger inti. Transaksi menggunakan kode ini akan tertahan di
                              staging area hingga pemetaan GL selesai dilakukan.
                          </p>
                      </div>

                  </div> -->
                </div>
            </div>
            <div class="row row-deck row-cards"  style="margin-top:20px;">
             
              <div class="col-12">
                <div class="card">
                  <div class="table-responsive" style="overflow-x:hidden;padding-bottom: 20px;">
                    <table id="table-kode-transaksi" class="table card-table table-striped table-vcenter text-nowrap datatable">
                      <thead>
                        <tr>
                          <th class="">
                              <input type="checkbox" style="margin-left:12px;height: 1.2rem !important; width: 1.2rem !important;" id="check-all">
                          </th>  
                          <th>KODE MNEMONIK</th>
                          <th>NAMA TRANSAKSI</th>
                          <th>AKSI</th>
                        </tr>
                      </thead>
                      <tbody>                       
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div th:replace="~{parameter/kodeTransaksi/add :: add}"></div>
      </div>
      <div layout:fragment="scripts">
          <link th:href="@{/css/kodeTransaksi.css}" rel="stylesheet">
          <link th:href="@{/lib/DataTables/datatables.min.css}" rel="stylesheet">
          <script th:src="@{/lib/DataTables/datatables.min.js}"></script>   
          <script th:src="@{/js/parameter/kode-transaksi.js}"></script>
      </div>
  </body>
</html>
