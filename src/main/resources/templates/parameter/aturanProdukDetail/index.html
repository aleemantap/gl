<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/main}"
>
  <head>
    <title>Aturan Produk</title>
  </head>
  <body>
    <div layout:fragment="content">
          <div class="container-xl">
            <div class="card">  
             <div class="" style="padding:20px;">
               
              </div>
                
              <div class="row row-deck row-cards p-4"  style="margin-top:0px;">  
                <input type="hidden" class="form-control" id="nama-produk-temp" th:value="${namaProduk}" readonly>
                <input type="hidden" class="form-control" id="kode-produk-temp" th:value="${kodeProduk}" readonly>
                <div class="col-lg-12">
                    <div class="card card-custom p-4 bg-white">
                    <!-- Judul & Badge Aktif -->
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h3 class="fw-bold m-0 text-dark">Konfigurasi Produk</h3>
                        <!-- <span class="badge badge-aktif">
                            
                            Aktif

                        </span> -->
                    </div>

                    <!-- Kode Produk -->
                    <div class="mb-3">
                        <div class="label-title mb-1">Kode Produk</div>
                        <div class="fw-bold text-dark fs-1" th:text="${kodeProduk}"></div>
                    </div>

                    <!-- Nama Produk -->
                    <div class="mb-4">
                        <div class="label-title mb-1">Nama Produk</div>
                        <div class="fw-bold text-dark fs-1" th:text="${namaProduk}"></div>
                    </div>

                    <hr class="text-secondary opacity-25 my-3">

                    <!-- Product Rule Component -->
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6 class="fw-bold m-1 text-dark" style="font-size: 1em;">Komponen Rule</h6>
                        <span class="badge badge-komponen" th:text="${componentRuleJumlah}"> komponen</span>
                    </div>

                    <!-- Tombol Detail Component -->
                    <div class="d-grid mt-2">
                        <a href="#" class="btn btn-detail btn-component text-center text-decoration-none btn-primary-black" style="margin-right: 10px;" th:data-id="${productRuleId}">
                        <span style="margin-right:5px;">Detail Komponen</span>
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                <path fill-rule="evenodd" d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8z"/>
                            </svg>
                        </a>
                    </div>
                    </div>
                </div>              
              </div>
            </div>

            <!-- KOMPONEN -->
            <div th:replace="~{parameter/aturanProdukDetail/component :: component}"></div>  
            <!-- JURNAL -->
            <div th:replace="~{parameter/aturanProdukDetail/journal :: journal}"></div>  
            <div th:replace="~{parameter/aturanProdukDetail/modalRule :: modalRule}"></div> 
            <div th:replace="~{parameter/aturanProdukDetail/modalComponent :: modalComponent}"></div>  
            <div th:replace="~{parameter/aturanProdukDetail/modalJournal :: modalJournal}"></div>
          </div>
          
    </div>
    <div layout:fragment="scripts">
        <link th:href="@{/css/select2.min.css}" rel="stylesheet">
        <link th:href="@{/css/select2-bootstrap-5-theme.min.css}" rel="stylesheet">
        <script th:src="@{/js/select2.min.js}"></script>
        <link th:href="@{/css/aturanProdukRule.css}" rel="stylesheet">
        <link th:href="@{/lib/DataTables/datatables.min.css}" rel="stylesheet">
        <script th:src="@{/lib/DataTables/datatables.min.js}"></script>   
        <script th:src="@{/js/parameter/aturan-produk-detail2.js}"></script>
        <script th:src="@{/js/parameter/aturan-produk-detail-component.js}"></script>
      </div>
  </body>
</html>
