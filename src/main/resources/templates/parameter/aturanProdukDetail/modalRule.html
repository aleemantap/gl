<div th:fragment="modalRule">
    <!-- Tambahkan class modal-dialog-scrollable agar modal memiliki scrollbar internal -->
    <div class="modal modal-blur fade" id="modal-detail-rule" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable modal3x-dialog" role="document">
            <div class="modal-content">
                
                <!-- Modal Header -->
                <div class="modal-header">
                    <h5 class="modal-title" id="viewModalLabel">Form Product Rule</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                
                <!-- Modal Body (Scrollable) -->
                <div class="modal-body p-4 modal3x-body">
                    <form id="productRuleForm">
                        <input type="hidden" id="ruleId" name="id">

                        <!-- SECTION 1: Informasi Dasar -->
                        <div class="card mb-3">
                            <div class="card-header bg-light">
                                <h6 class="card-title mb-0 fw-bold">1. Informasi Dasar Produk</h6>
                            </div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <label for="" class="form-label fw-bold">Nama Produk <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="produk" th:value="${namaProduk}" readonly>

                                </div> 
                               <input type="hidden" 
                                    class="form-control" 
                                    id="productId" 
                                    name="productId" 
                                    th:value="${productId}" />                            

                                <div class="mb-0">
                                    <label for="ruleVersion" class="form-label fw-bold">Rule Version <span class="text-danger">*</span></label>
                                    <input type="number" class="form-control" id="ruleVersion" name="ruleVersion" value="1" min="1" required>
                                    <div class="invalid-feedback" id="ruleVersionError"></div>
                                </div>
                            </div>
                        </div>

                        <!-- SECTION 2: Masa Berlaku -->
                        <div class="card mb-3">
                            <div class="card-header bg-light">
                                <h6 class="card-title mb-0 fw-bold">2. Masa Berlaku Rule</h6>
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-6 mb-3 mb-md-0">
                                        <label for="effectiveFrom" class="form-label fw-bold">Effective From <span class="text-danger">*</span></label>
                                        <input type="date" class="form-control" id="effectiveFrom" name="effectiveFrom" required>
                                        <div class="invalid-feedback" id="effectiveFromError"></div>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="effectiveTo" class="form-label fw-bold">Effective To</label>
                                        <input type="date" class="form-control" id="effectiveTo" name="effectiveTo">
                                        <div class="invalid-feedback" id="effectiveToError"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                                <div class="mb-0">
