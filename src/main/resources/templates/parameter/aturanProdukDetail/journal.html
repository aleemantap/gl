<div th:fragment="journal">
    <div class="card mt-3" id="journal" style="display: none;">
        <div class="card-header d-flex justify-content-between align-items-center" style="padding: 0.4rem 1.24rem !important;">
            <h3 class="mb-0">Journal</h3>
            <div id="hide-journal" class="h3"  style="cursor: pointer;">Hide</div>
        </div>
        <div class="row mb-3 align-items-center p-4">                  
            <div class="col-lg-6">
                <div class="row g-2">
                <div class="col-md-7">
                    <input type="text" id="searchInput" class="form-control" placeholder="Search by code or name...">
                </div>
                <div class="col-md-5">
                    <select id="statusFilter" class="form-control">
                    <option value="">All Status</option>
                    <option value="true">Active</option>
                    <option value="false">Inactive</option>
                    </select>
                </div>
                </div>
            </div>
            <div class="col-lg-6 mt-2 mt-lg-0">
                <div class="d-flex justify-content-end gap-2">
                <button class="btn btn-primary btn-primary-yellow">Apply Filter</button>
                <button class="btn btn-secondary btn-primary-grey">Reset</button>
                <button class="btn btn-success btn-primary-black" id="btn-add-produk-rule-journal">Add</button>
                </div>
            </div>
        </div>
        <div class="row row-deck row-cards p-4">
              <div class="col-lg-12">
                  <div class="card">                    
                        <div class="table-responsive">
                            <table id="table-component-rule-journal" class="table table-striped card-table table-vcenter text-nowrap datatable">
                                <thead>
                                    <tr>
                                      <th>JournalID/Code</th>
                                      <th>Sequence</th>
                                      <th>Aktif</th>
                                      <th>Aksi</th>
                                    </tr>
                                </thead>
                            <tbody>                       
                            </tbody>
                            </table>
                        </div>
                  </div>
                </div>  
        </div>
    </div> 
</div>
