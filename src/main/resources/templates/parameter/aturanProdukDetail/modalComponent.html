<div th:fragment="modalComponent">
    <!-- Tambahkan class modal-dialog-scrollable agar modal memiliki scrollbar internal -->
    <div class="modal modal-blur fade" id="modal-detail-rule-component" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable modal3x-dialog" role="document">
            <div class="modal-content">
                
                <!-- Modal Header -->
                <div class="modal-header">
                    <h5 class="modal-title" id="viewModalLabel">Form Product Rule Component</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                
                <!-- Modal Body (Scrollable) -->
                <div class="modal-body p-4 modal3x-body">
                    <form id="componentForm">
                        <input type="hidden" id="product_rule_component_id" name="product_rule_component_id">
                        <input type="hidden" class="form-control" id="productRuleId" name="productRuleId" required placeholder="productRuleId">
                        <!-- <div class="mb-3">
                            <label for="componenCode" class="form-label">Component Code *</label>
                            <select class="form-select select2" id="componenCode" name="componenCode" required>
                                   <option value="" selected disabled>-- Pilih Component Code --</option>
                                    <th:block th:each="c : ${componentList}">
                                       <option th:value="${c.id}" th:text="${c.componentCode} + ' - ' + ${c.componentName}"></option>
                                    </th:block>                                
                            </select>

                          
                        </div>
                        <div class="mb-3">
                            <label for="sequenceNo" class="form-label">Calculation Type</label>
                            <select class="form-select" id="calculation_type" name="calculation_type" required>
                                <option value="" selected disabled>-- Pilih Calculation Type --</option>
                                <option value="INPUT">INPUT</option>
                                <option value="CALCULATED">CALCULATED</option>
                                <option value="FIXED">FIXED</option>
                            </select>
                        </div>  -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="componenCode" class="form-label">Component Code *</label>
                                <select class="form-select select2" id="componenCode" name="componenCode" required>
                                <option value="" selected disabled>-- Pilih Component Code --</option>
                                <th:block th:each="c : ${componentList}">
                                    <option th:value="${c.id}" th:text="${c.componentCode} + ' - ' + ${c.componentName}"></option>
                                </th:block>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="calculation_type" class="form-label">Calculation Type</label>
                                <select class="form-select" id="calculation_type" name="calculation_type" required>
                                <option value="INPUT">INPUT</option>
                                <!-- <option value="CALCULATED">CALCULATED</option> -->
                                <!-- <option value="FIXED">FIXED</option> -->
                                </select>
                            </div>
                        </div>
                       
                        <div class="row mb-3">
                            <div class="col-md-12" id="amount_source_div" >
                                <label for="amount_source" class="form-label">Amount Source</label>
                                <select class="form-select" id="amount_source" name="amountSource" required>
                                    <option value="" selected disabled>-- Pilih Amount Source --</option>
                                    <option value="loan_amount">loan_amount</option>
                                    <option value="repayment_amount">repayment_amount</option>
                                    <option value="interest_amount">interest_amount</option>
                                    <option value="admin_cost">admin_cost</option>
                                    <option value="provision">provision</option>
                                    <option value="customer_cash">customer_cash</option>
                                    <option value="principal_payment">principal_payment</option>
                                    <option value="payment_amount">payment_amount</option>
                                </select>
                            </div>
                            <div class="col-md-6" id="fixed_amount_div" style="display: none;">
                                <label for="amount_source" class="form-label">Fixed Amount</label>
                                <input type="number" class="form-control" id="fixed_amount" name="fixed_amount" />
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-4" id="SourceComponent_div" style="display: none;">
                                <label for="amount_source" class="form-label">Source Component</label>
                                <select class="form-select select2" id="SourceComponent" name="SourceComponent">
                                <option value="" selected disabled>-- Source Component  --</option>
                                    <th:block th:each="c : ${componentList}">
                                        <option th:value="${c.id}" th:text="${c.componentCode} + ' - ' + ${c.componentName}"></option>
                                    </th:block>
                                </select>
                            </div>
                            <div class="col-md-4" id="CalculationRate_div" style="display: none;">
                                <label for="CalculationRate" class="form-label">Calculation Rate</label>
                                <input type="number" class="form-control" id="CalculationRate" name="CalculationRate" />
                            </div>

                            <!-- <div class="col-md-12">
                                <label for="sequenceNo" class="form-label">Cash Movement Type</label>
                                <select class="form-select" id="cash_movement_type" name="cash_movement_type" required>
                                    <option value="" selected disabled>-- Pilih Cash Movement Type --</option>
                                    <option value="IN">IN</option>
                                    <option value="OUT">OUT</option>
                                    <option value="NONE">NONE</option>
                                </select>
                            </div> -->
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-4" style="display: none;">
                                <label for="CalculationRate" class="form-label">Calculation Period</label>
                                <input type="number" class="form-control" id="CalculationPeriod" name="CalculationPeriod" />
                            </div>
                            <div class="col-md-4" style="display: none;">
                                <label for="CalculationMethod" class="form-label">Calculation Method</label>                               
                                <select class="form-select" id="CalculationMethod" name="CalculationMethod" >
                                    <option value="" selected disabled>-- Pilih Cash Movement Type --</option>
                                    <option value="FLAT">FLAT</option>
                                    <option value="EFFECTIVE">EFFECTIVE</option>
                                    <option value="FIXED">FIXED</option>
                                </select>
                            </div>

                        </div>
                      
                        <div class="mb-3">
                            <label for="isActive" class="form-label">Status</label>
                            <select class="form-control" id="isActive" name="isActive">
                                <option value="1">Active</option>
                                <option value="0">Inactive</option>
                            </select>
                        </div>
                    </form>
                </div>
                
                <!-- Modal Footer -->
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times"></i> Batal
                    </button>
                    <button type="button" class="btn btn-primary" id="btnSaveRuleComponent">
                        <i class="fas fa-save"></i> Simpan
                    </button>
                </div>

            </div>
        </div>
    </div>
</div>
