<div th:fragment="add2">
    <div class="modal modal-blur fade" id="modal2" tabindex="-1" role="dialog"  aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered  modal2-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle2">
                        Buat Journal ID Baru
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="form2">
                    <div class="modal-body  modal2-body">
                        <div class="row">
                           
                            <div class="col-md-4 mb-3">
                                <label class="form-label required">JOURNALID</label>
                                 <input type="hidden" id="journalKode" name="journalKode"/>
                                  
                                <div class="input-group mb-2">
                                     <input type="text" class="form-control bg-readonly" id="journalIdDisplay" name="journalIdDisplay" placeholder="JournalId" readonly>
                                    <button class="btn btn-primary-yellow2" id="generate-id" type="button">Generate</button>
                                </div>
                                <div class="invalid-feedback" id="journalIdError"></div>
                            </div>
                            <input type="hidden" class="form-control" id="jr_id" name="jr_id"/>
                            <div class="col-md-4 mb-3">                                    
                                <label class="form-label">DESKRIPSI</label>
                                <textarea style="text-align: left; vertical-align: top;" class="form-control" id="catatan" name="catatan" rows="1" placeholder=" Tambahkan keterangan pemetaan untuk referensi audit... " required></textarea>
                                <div class="invalid-feedback" id="catatanError"></div>
                            </div>
                            <div class="col-md-4 mb-3">                                    
                                <label class="form-label">PRODUK-RULE</label>
                                <select class="form-select select2" id="productRuleId" name="productRuleId">
                                       <option value="">-- Pilih Product Rule --</option>
                                        <option
                                            th:each="rule : ${productRules}"
                                            th:value="${rule.id}"
                                            th:text="${rule.productName + ' - Rule v' + rule.ruleVersion
                                                    + ' - Berlaku ' + rule.effectiveFrom}">
                                        </option>
                                </select>
                                <!-- <input type="text" class="form-control" id="produk_rule" name="produk_rule"/> -->
                                <div class="invalid-feedback" id="produk_ruleError"></div>
                            </div>
                        </div>

                        <div id="rw-tbl" style="display: none;">
                            <div class="row mb-3 align-items-end">
                                <!-- BAGIAN KIRI -->
                                <div class="col-md-6">
                                    <!-- Tombol Toggle Filter -->
                                    <div class="row mb-2">
                                        <div class="col-12">
                                            <button type="button" 
                                                    class="btn btn-outline-primary btn-sm" 
                                                    id="toggleFilterBtn">
                                                <i class="ti ti-chevron-down" id="toggleIcon"></i>
                                                <span id="toggleText">Sembunyikan Filter</span>
                                            </button>
                                        </div>
                                    </div>

                                    <!-- Container Filter -->
                                    <div id="filterContainer">
                                        <div class="row">
                                            <!-- Nomor GL -->
                                            <div class="col-md-4">
                                                <label class="form-label">Nomor GL</label>
                                                <input type="text"
                                                    class="form-control form-control-sm"
                                                    id="filterNomorGl"
                                                    placeholder="Nomor GL">
                                            </div>

                                            <!-- Nama GL -->
                                            <div class="col-md-4">
                                                <label class="form-label">Nama GL</label>
                                                <input type="text"
                                                    class="form-control form-control-sm"
                                                    id="filterNamaGl"
                                                    placeholder="Nama GL">
                                            </div>

                                            <!-- Kategori -->
                                            <div class="col-md-4">
                                                <label class="form-label">Type GL</label>
                                                <select class="form-select form-select-sm"
                                                        id="filterKategori">
                                                    <option value="">Semua</option>
                                                    <th:block th:each="kategori : ${kategoriList}">
                                                        <option th:value="${kategori.id}"
                                                                th:text="${kategori.name}">
                                                        </option>
                                                    </th:block>
                                                </select>
                                            </div>
                                        </div>
                                        
                                        <div class="row mt-2">
                                            <!-- D/K -->
                                            <div class="col-md-4">
                                                <label class="form-label">Saldo D/K</label>
                                                <select class="form-select form-select-sm"
                                                        id="filterDk">
                                                    <option value="">Semua</option>
                                                    <option value="D">Debit</option>
                                                    <option value="K">Kredit</option>
                                                </select>
                                            </div>
    
                                            <!-- Cabang -->
                                            <!-- <div class="col-md-4">
                                                <label class="form-label">Cabang</label>
                                                <select class="form-select form-select-sm"
                                                        id="cabangIdModal"
                                                        name="cabangIdModal">
                                                    <option value="">Semua Cabang</option>
                                                    <th:block th:each="cabang : ${cabangList}">
                                                        <option th:value="${cabang.id}"
                                                                th:text="${cabang.namaCabang}">
                                                        </option>
                                                    </th:block>
                                                </select>
                                            </div> -->

                                            <!-- Action -->
                                            <div class="col-md-4">
                                                <div class="d-flex gap-2">
                                                    <button type="button"
                                                            class="btn btn-primary btn-sm"
                                                            id="btnFilterGl">
                                                        <i class="ti ti-filter"></i>
                                                        Filter
                                                    </button>

                                                    <button type="button"
                                                            class="btn btn-outline-secondary btn-sm"
                                                            id="btnResetFilterGl">
                                                        <i class="ti ti-refresh"></i>
                                                        Reset
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <div class="row">
                                        <div class="col-md-3"><span class="badge success">Journal Line Template</span></div>
                                    </div>
                                </div>
                            </div>                        
                            <div class="row">
                                <!-- TABEL GL -->
                                <div class="col-md-6">
                                    <table id="table2-map-gl-account"
                                        class="table table-striped card-table table-vcenter text-nowrap datatable">
                                        <thead>
                                            <tr>
                                                <th style="width: 20px;" class="text-center">Check</th>
                                                <th>Nomor GL</th>
                                                <th>Nama GL</th>
                                                <th>Type GL</th>                                               
                                            </tr>
                                        </thead>

                                        <tbody>
                                        </tbody>

                                    </table>

                                </div>


                                <!-- KOLOM TAMPUNG -->
                                <div class="col-md-6">                          

                                        <div class="table-responsive">
                                            <table id="table-gl-selected"
                                                class="table table-striped table-vcenter">

                                                <thead>
                                                    <tr>
                                                        <th style="display: none;">id</th>
                                                        <th>Nomor GL</th>
                                                        <th>Nama Akun</th>
                                                        <th>DK</th>
                                                        <th>Komponen Rule</th>
                                                        <th>Tipe Pergerakan Cash</th>
                                                        <th style="width: 50px;"></th>
                                                    </tr>
                                                </thead>

                                                <tbody>
                                                </tbody>

                                            </table>

                                        </div>

                            

                                </div>

                            </div>
                        </div>
                       
                    
                    </div>
                    <div class="modal-footer d-flex justify-content-end gap-2">
                        <button type="button" class="btn btn-outline-dark" data-bs-dismiss="modal">Batal</button>
                        <button type="submit" class="btn btn-primary" id="btnSubmit2">
                            <strong>Simpan JournalID</strong>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
