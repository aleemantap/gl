<!DOCTYPE html>

<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/main}"
>
<head>
    <title>User Form</title>
</head>
<body>
 <div layout:fragment="content">
     <div class="container-xl">
        <div class="row justify-content-center">
            <div class="col-md-12">
                <div class="card shadow-sm">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h4 class="mb-0" id="title-user" th:text="${title}">
                            Add User
                        </h4>
                        <div>
                            <a class="btn btn-secondary btn-sm"
                               th:href="@{/management/users}">Back
                            </a>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email</label>
                                <input type="text" class="form-control" id="email">
                                <input type="hidden"  id="user-id" th:value="${idUser}" />
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nama Lengkap</label>
                                <input type="text" class="form-control" id="name">
                            </div>

                         
                            <div class="col-md-6 mb-3" id="pass">
                                <label class="form-label">Password</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="password">
                                    <span class="input-group-text toggle-password" data-target="#password" style="cursor:pointer;">
                                        <!-- Eye (default: password tersembunyi) -->
                                        <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                                        </svg>
                                        <!-- Eye slash -->
                                        <svg class="icon-eye-slash d-none" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
                                        </svg>
                                    </span>
                                </div>
                            </div>

                            <div class="col-md-6 mb-3" id="pass2">
                                <label class="form-label">Ulangi Password</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="confirm-password">
                                    <span class="input-group-text toggle-password" data-target="#confirm-password" style="cursor:pointer;">
                                        <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                                        </svg>
                                        <svg class="icon-eye-slash d-none" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
                                        </svg>
                                    </span>
                                </div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="userGroupId" class="form-label">Pilih User Group</label>
                                <select class="form-control select2" id="userGroupId" name="userGroupId" required>
                                    <option value="">-- Pilih User Group --</option>
                                    <option th:each="userGroup : ${roles}" 
                                            th:value="${userGroup.id}" 
                                            th:text="${userGroup.name}"
                                            >
                                    </option>
                                </select>
                            </div>

                            <div class="col-md-6 mb-3" id="u-cs">
                                <label for="customerId" class="form-label">Pilih Cabang</label>
                                <select class="form-control select2" id="cabangId" name="cabangId">
                                    <option value="">-- Pilih Cabang --</option>
                                    <option th:each="cabang : ${cabangList}" 
                                            th:value="${cabang.id}" 
                                            th:text="${cabang.namaCabang}"
                                            >
                                    </option>
                                </select>
                            </div>

                           

                            <div class="col-md-12 mb-3">
                                <label class="form-label">Active</label>
                                <div>
                                    <!-- Radio sebagai Button -->
                                    <div class="btn-group" role="group" aria-label="Active status">
                                        <input type="radio" class="btn-check" name="active" id="user-active-yes" value="Y" checked autocomplete="off">
                                        <label class="btn btn-outline-success" for="user-active-yes">
                                            <i class="fas fa-check-circle"></i> Yes
                                        </label>
                                        
                                        <input type="radio" class="btn-check" name="active" id="user-active-no" value="N" autocomplete="off">
                                        <label class="btn btn-outline-danger" for="user-active-no">
                                            <i class="fas fa-times-circle"></i> No
                                        </label>
                                    </div>
                                </div>
                            </div>

                        </div>

                        <hr>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/management/users}" class="btn btn-secondary">
                                <i class="fa fa-arrow-left"></i> Back
                            </a>

                            <button type="button" class="btn btn-primary" id="btn-submit-user">
                                <i class="fa fa-save"></i>
                                <span th:text="${idUser != null ? 'Ubah' : 'Simpan'}">Simpan</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Custom JS for this page -->
<div layout:fragment="scripts">
<!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">    -->

<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0/dist/css/select2.min.css" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0/dist/js/select2.min.js"></script>
<link th:href="@{/css/select2-custom.css}" rel="stylesheet">
<script th:src="@{/js/management/user-form.js}"></script>
</div>
</body>
</html>
