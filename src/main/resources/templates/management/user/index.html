<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/main}"
>
  <head>
    <title>User List</title>
  </head>
  <body>
    <div layout:fragment="content">
    
     <div class="container-xl">
            <div class="row g-2 align-items-center">
              <div class="col">
                <!-- Page pre-title -->
                <div class="page-title">
                 Manajemen Pengguna
                </div>
                <h2 class="page-pretitle">
                  Kelola hak akses dan perizinan personel sistem GL Gadai.
                </h2>
              </div>
              <!-- Page title actions -->
              <div class="col-auto ms-auto d-print-none">
                <div class="btn-list">
                  <a href="#" class="btn btn-primary d-none d-sm-inline-block" id="btnTambahUser">
                    <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0" /><path d="M16 19h6" /><path d="M19 16v6" /><path d="M6 21v-2a4 4 0 0 1 4 -4h4" /></svg>
                    Tambah Pengguna
                  </a>
                  <!-- <a href="#" class="btn btn-primary d-sm-none btn-icon" data-bs-toggle="modal" data-bs-target="#modal-report" aria-label="Create new report">
                    <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M12 5l0 14"></path><path d="M5 12l14 0"></path></svg>
                  </a> -->
                  <button type="button" class="btn btn-primary-grey" id="btn-export-user">
                    <img style="margin-right: 6px;" th:src="@{/img/download.png}" />Export
                  </button> 
                </div>
              </div>
            </div>
            
            <div style="margin-top:20px;" class="row row-deck row-cards">
                 <div class="row mb-3 align-items-end">
                  <!-- BAGIAN KIRI -->
                  <div class="col-md-12">
                      <!-- Tombol Toggle Filter -->
                      <div class="row mb-2">
                          <div class="col-12">
                              <button type="button" 
                                      class="btn btn-outline-primary btn-sm" 
                                      id="toggleFilterBtn">
                                  <i class="ti ti-chevron-down" id="toggleIcon"></i>
                                  <span id="toggleText">Sembunyikan Filter</span>
                              </button>
                          </div>
                      </div>

                      <!-- Container Filter -->
                      <div id="filterContainer">
                          <div class="row">
                              <!-- Nomor GL -->
                              <div class="col-md-4">
                                  <label class="form-label">Nama</label>
                                  <input type="text"
                                      class="form-control form-control"
                                      id="filterNama"
                                      placeholder="Nama">
                              </div>

                           
                              <!-- type -->
                              <div class="col-md-4">
                                  <label class="form-label">Role/Peran</label>
                                  <select class="form-select form-select"
                                          id="filterRole">
                                       <option value="">Semua</option>
                                      <th:block th:each="kategori : ${roles}">
                                          <option th:value="${kategori.id}"
                                                  th:text="${kategori.name}">
                                          </option>
                                      </th:block>
                                  </select>
                              </div>
                          </div>
                          
                          <div class="row mt-2">
                              <!-- D/K -->
                              <div class="col-md-4">
                                  <label class="form-label">Status</label>
                                  <select class="form-select form-select" id="filterStatus">
                                      <option value="">Semua</option>
                                      <option value="Y">Aktif</option>
                                      <option value="N">Tidak Aktif</option>
                                  </select>
                              </div> 

                              <!-- Cabang -->
                               <div class="col-md-4">
                                  <label class="form-label">Cabang</label>
                                  <select class="form-select form-select select2"
                                          id="filterCabang"
                                          name="cabangGL">
                                      <option value="">Semua Cabang</option>
                                      <th:block th:each="cabang : ${cabangList}">
                                          <option th:value="${cabang.id}"
                                                  th:text="${cabang.namaCabang}">
                                          </option>
                                      </th:block>
                                  </select>
                              </div> 

                              <!-- Action -->
                              <div class="col-md-4">
                                  <div class="d-flex gap-2" style="margin-top: 2em;">
                                      <button type="button"
                                              class="btn btn-primary btn-md"
                                              id="btn-filter">
                                          <i class="ti ti-filter"></i>
                                          Filter
                                      </button>

                                      <button type="button"
                                              class="btn btn-outline-secondary btn-sm"
                                              id="btn-reset">
                                          <i class="ti ti-refresh"></i>
                                          Reset
                                      </button>
                                  </div>
                              </div>
                          </div>
                      </div>
                  </div>

            </div>
              <div class="col-12">
                <div class="card">
                    <div class="table-responsive">
                        <table id="table-users" class="table card-table table-striped table-vcenter text-nowrap datatable">
                            <thead> 
                                <tr>
                                    <th class="">
                                        <input type="checkbox" style="margin-left:12px;height: 1.2rem !important; width: 1.2rem !important;" id="check-all">
                                    </th>                          
                                    <th>id</th>
                                    <th>Nama</th>
                                    <th>Email</th>
                                    <th>Peran</th>
                                    <th>Cabang Akses</th>
                                    <th>Status</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody>                        
                            </tbody>                    
                        </table>
                    </div>                
                </div>
              </div>
            </div>
          
          </div>
       
    </div>
    <div layout:fragment="scripts">
        <style>
          .dt-paging {
            margin-bottom: 20px !important;
          }
          /* .custom-dropdown-menu a:hover {
              background-color: #f8f9fa !important;
              color: #007bff !important;
          } */
           .dropdown-item-custom:hover {
              background-color: #f8f9fa !important;
          } 
          
        </style>
        <link th:href="@{/lib/DataTables/datatables.min.css}" rel="stylesheet">
        <script th:src="@{/lib/DataTables/datatables.min.js}"></script>   
        <script th:src="@{/js/management/user-list.js}"></script>
    </div>
  </body>
</html>
