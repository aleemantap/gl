                      <div class="row mb-2">
                          <div class="col-12">
                              <button type="button" 
                                      class="btn btn-outline-primary btn-sm" 
                                      id="toggleFilterBtn">
                                  <i class="ti ti-chevron-down" id="toggleIcon"></i>
                                  <span id="toggleText">Sembunyikan Filter</span>
                              </button>
                          </div>
                      </div>

                      <!-- Container Filter -->
                      <div id="filterContainer">
                          <div class="row">
                              <!-- Nomor GL -->
                              <div class="col-md-4">
                                  <label class="form-label">Nama</label>
                                  <input type="text"
                                      class="form-control form-control"
                                      id="filterNama"
                                      placeholder="Nama">
                              </div>

                           
                              <!-- type -->
                              <div class="col-md-4">
                                  <label class="form-label">Role/Peran</label>
                                  <select class="form-select form-select"
                                          id="filterRole">
                                       <option value="">Semua</option>
                                      <th:block th:each="kategori : ${roles}">
                                          <option th:value="${kategori.id}"
                                                  th:text="${kategori.name}">
                                          </option>
                                      </th:block>
                                  </select>
                              </div>
                          </div>
                          
                          <div class="row mt-2">
                              <!-- D/K -->
                              <div class="col-md-4">
                                  <label class="form-label">Status</label>
                                  <select class="form-select form-select" id="filterStatus">
                                      <option value="">Semua</option>
                                      <option value="Y">Aktif</option>
                                      <option value="N">Tidak Aktif</option>
                                  </select>
                              </div> 

                              <!-- Cabang -->
                               <div class="col-md-4">
                                  <label class="form-label">Cabang</label>
                                  <select class="form-select form-select select2"
                                          id="filterCabang"
                                          name="cabangGL">
                                      <option value="">Semua Cabang</option>
                                      <th:block th:each="cabang : ${cabangList}">
                                          <option th:value="${cabang.id}"
                                                  th:text="${cabang.namaCabang}">
                                          </option>
                                      </th:block>
                                  </select>
                              </div> 

                              <!-- Action -->
                              <div class="col-md-4">
                                  <div class="d-flex gap-2" style="margin-top: 2em;">

                                              id="btn-reset">

                                          Reset
                                      </button>
                                  </div>
                              </div>
                          </div>
                      </div>
