<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/main}"
>
  <head>
    <title>Groups</title>
  </head>
  <body>
    <div layout:fragment="content">
         <div class="container-xl">
            <div class="row g-2 align-items-center">
              <div class="col">
                <!-- Page pre-title -->
                <div class="page-title">
                 Manajemen Groups
                </div>
                <h2 class="page-pretitle">
                  Kelola Group/Roles.
                </h2>
              </div>           
              <div class="col-auto ms-auto d-print-none">
                <div class="btn-list">
                  <a th:href="@{/management/groups/create}" class="btn btn-primary d-none d-sm-inline-block" id="btnTambahGroup">
                    Tambah Group
                  </a>                
                  <button type="button"
                          class="btn btn-primary-grey"
                          id="btn-export-user"
                        >
                        <img style="margin-right: 6px;" th:src="@{/img/download.png}" />Export
                  </button> 
                </div>
              </div>
            </div>
            <div style="margin-top:20px;" class="row row-deck row-cards">
              <div class="col-12">
                <div class="card">                 
                    <div class="table-responsive"  style="overflow-x:hidden;padding-bottom: 20px;">
                        <table id="table-groups" class="table table-striped card-table table-vcenter text-nowrap datatable">
                            <thead> 
                                <tr>
                                    <th>id</th>
                                    <th>Nama</th>
                                    <th>Keterangan</th>
                                    <th>Aktif</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody>                        
                            </tbody>                    
                        </table>
                    </div>

              
                </div>
              </div>
            </div>
          </div>       
    </div>
    <div layout:fragment="scripts">
        <!-- Tambahkan SheetJS untuk membaca Excel -->
        <style>
          .dt-paging {
            margin-bottom: 20px !important;
        }
        </style>
        <link th:href="@{/css/select2.min.css}" rel="stylesheet">
        <link th:href="@{/css/select2-bootstrap-5-theme.min.css}" rel="stylesheet">
        <script th:src="@{/js/select2.min.js}"></script>
        <link th:href="@{/lib/DataTables/datatables.min.css}" rel="stylesheet">
        <script th:src="@{/lib/DataTables/datatables.min.js}"></script>   
        <script th:src="@{/js/management/groups-list.js}"></script>
    </div>
  </body>
</html>
