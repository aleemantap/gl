<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/main}"
>
<head>
    <title>Teller</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container-xl">

        <!-- Header -->
        <div class="row g-2 align-items-center">
            <div class="col">
                <div class="page-title">Master Teller</div>
            </div>
            <div class="col-auto ms-auto d-print-none">
                <div class="btn-list">
                    <a href="#" class="btn btn-primary" id="btnAdd">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                            <path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0" />
                            <path d="M16 19h6" />
                            <path d="M19 16v6" />
                            <path d="M6 21v-2a4 4 0 0 1 4 -4h4" />
                        </svg>
                        Tambah Teller
                    </a>
                </div>
            </div>
        </div>

        <!-- Filter -->
        <div style="margin-top:20px;" class="row row-deck row-cards">
            <div class="row mb-3 align-items-end">
                <div class="col-md-12">
                    <div class="row mb-2">
                        <div class="col-12">
                            <button type="button"
                                    class="btn btn-outline-primary btn-sm"
                                    id="toggleFilterBtn">
                                <i class="ti ti-chevron-down" id="toggleIcon"></i>
                                <span id="toggleText">Sembunyikan Filter</span>
                            </button>
                        </div>
                    </div>

                    <div id="filterContainer">
                        <div class="row">
                            <div class="col-md-4">
                                <label class="form-label">Nama</label>
                                <input type="text" class="form-control" id="filterNama" placeholder="Nama">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">User Gadai</label>
                                <input type="text" class="form-control" id="filterUserGadai" placeholder="User Gadai">
                            </div>
                            <div class="col-md-4">
                                <div class="d-flex gap-2" style="margin-top: 2em;">
                                    <button type="button" class="btn btn-primary btn-md" id="btn-filter">
                                        <i class="ti ti-filter"></i> Filter
                                    </button>
                                    <button type="button" class="btn btn-outline-secondary btn-sm" id="btn-reset">
                                        <i class="ti ti-refresh"></i> Reset
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tabel -->
            <div class="col-12">
                <div class="card">
                    <div class="table-responsive">
                        <table id="tblTeller" class="table card-table table-striped table-vcenter text-nowrap datatable">
                            <thead>
                            <tr>
                                <th>#</th>
                                <th>Nama</th>
                                <th>User Gadai</th>
                                <th>Created At</th>
                                <th>Updated At</th>
                                <th width="120">Aksi</th>
                            </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Fragment modal -->
    <div th:replace="~{master/teller/form :: form}"></div>
</div>

<div layout:fragment="scripts">
    <style>
        .dt-paging { margin-bottom: 20px !important; }
    </style>

 
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0/dist/css/select2.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0/dist/js/select2.min.js"></script>
    
    <link th:href="@{/lib/DataTables/datatables.min.css}" rel="stylesheet">
    <script th:src="@{/lib/DataTables/datatables.min.js}"></script>
    <link th:href="@{/css/select2-custom.css}" rel="stylesheet">
        


    <!-- JS halaman (file terpisah) -->
    <script th:src="@{/js/master/teller.js}"></script>
</div>
</body>
</html>
