# 1. Matikan fitur show-sql bawaan Spring JPA
spring.jpa.show-sql=true

# 2. Matikan fitur show_sql langsung dari Hibernate (jika ada)
spring.jpa.properties.hibernate.show_sql=false

# 3. Ubah level logging org.hibernate.SQL dari DEBUG menjadi INFO atau WARN
logging.level.org.hibernate.SQL=DEBUG
#info 
# DEBUG

# 4. (Optional) Jika kamu menggunakan Hibernate versi baru (Spring Boot 3+), matikan juga logging parameternya
logging.level.org.hibernate.orm.results=info

