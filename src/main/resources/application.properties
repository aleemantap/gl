spring.application.name=GL

# ========================================
# KONEKSI DATABASE MYSQL
# ========================================

# URL koneksi ke database Laravel kamu
# spring.datasource.url=jdbc:mysql://localhost:3306/emcu_20122025_025354?useSSL=false&serverTimezone=Asia/Jakarta&allowPublicKeyRetrieval=true
# spring.datasource.url=${DB_URL}
# spring.datasource.url=jdbc:mysql://localhost:3306/emcu-08-06-2026?useSSL=false&serverTimezone=Asia/Jakarta&allowPublicKeyRetrieval=true
spring.datasource.url=jdbc:mysql://localhost:3306/gl_new?useSSL=false&serverTimezone=Asia/Jakarta&allowPublicKeyRetrieval=true

# Username database
spring.datasource.username=root
# spring.datasource.username=${DB_USER}
spring.datasource.password=
# spring.datasource.password=${DB_PASSWORD}

# JANGAN DIUBAH! Ini proteksi biar tabel-tabel Laravel-mu gak berubah
spring.jpa.hibernate.ddl-auto=none


# Driver MySQL (wajib)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# Password database (KOSONG, karena kamu gak pake password)


# ========================================
# KONFIGURASI JPA / HIBERNATE
# ========================================


# Biar keliatan SQL-nya di console (membantu debugging)
# spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialect untuk MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect


# Ganti port Spring Boot ke 8081
server.port=8081

# Buat user custom (ganti sesuai keinginan)
spring.security.user.name=admin
spring.security.user.password=12345
spring.security.user.roles=ADMIN


# Pastikan transaction management enabled
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# spring.jdbc.batch_versioned_data=false

# Biar lebih mudah debug
logging.level.org.springframework.transaction=DEBUG
logging.level.org.hibernate.transaction=DEBUG
# logging.level.org.hibernate.SQL=DEBUG

# logging.level.org.springframework.transaction=DEBUG
# logging.level.org.hibernate.SQL=DEBUG

# Thymeleaf
# spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html


# application.properties
spring.web.resources.static-locations=file:uploads/,classpath:/static/
# spring.web.resources.static-locations=classpath:/static/

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.jpa.open-in-view=true


# logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=DEBUG
#TRACE


# Maksimal koneksi yang bisa dibuat (default 10000)
server.tomcat.max-connections=5000

# Maksimal thread yang bekerja bersamaan (default 200)
# Artinya: server bisa handle 200 request dalam waktu bersamaan
server.tomcat.max-swallow-size=100

# Antrian request kalau thread penuh (default 100)
server.tomcat.accept-count=50


# Maksimal ukuran request body (misal upload file)
server.tomcat.max-http-form-post-size=2MB

# Timeout koneksi
server.tomcat.connection-timeout=60000ms

# Set session timeout jadi 8 jam (dalam detik)
server.servlet.session.timeout=28800s



